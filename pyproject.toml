[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fudan-icourse-subscriber"
version = "0.6.1"
description = "iCourse for macOS: cloud transcription and whole-lecture notes"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "requests>=2.32,<3", "pycryptodome>=3.23,<4", "openai>=2,<4",
  "markdown>=3.8,<4", "pygments>=2.19,<3", "pillow>=11,<13",
  "platformdirs>=4.3,<5", "keyring>=25.6,<26", "filelock>=3.18,<4",
]

[project.optional-dependencies]
mac = ["PySide6>=6.10,<6.12"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12"]

[project.scripts]
icourse = "src.cli:main"
icourse-mac = "src.mac_gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "tools"]
include = ["**/*.py"]
exclude = ["**/.env*", "**/*.md", "**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tools", "scripts", "tests", "docs", "README.md", "CHANGELOG.md", "NOTICE.md", "SHARE_GUIDE.md", "pyproject.toml", "uv.lock", "requirements.txt", ".env.example", ".gitignore", "安装 Mac.command", "启动 iCourse.command"]
exclude = ["**/.env", "**/.env.*", "**/.icourse*", "**/__pycache__", "**/*.pyc", "**/*.log"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
